<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-labelledby="title description">
  <title id="title">Ali Owlia neon profile banner</title>
  <desc id="description">A restrained animated neon banner for an Engineering Science portfolio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060916"/>
      <stop offset="0.65" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#15091e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00eaff"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff3bd4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="210" rx="18" fill="url(#background)"/>
  <rect x="2" y="2" width="996" height="206" rx="16" fill="none" stroke="url(#neon)" stroke-width="2.5"/>

  <text x="56" y="92" fill="#f2fbff" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" letter-spacing="4">ALI OWLIA</text>
  <text x="59" y="126" fill="#00eaff" font-family="Consolas, Monaco, monospace" font-size="16" font-weight="700" letter-spacing="2.2">ENGINEERING SCIENCE // UNIVERSITY OF TEHRAN</text>
  <text x="59" y="157" fill="#a7b4d6" font-family="Consolas, Monaco, monospace" font-size="14" letter-spacing="1.3">EMBEDDED AI · SIMULATION · OPTIMIZATION · COMPUTATIONAL MODELING</text>

  <path d="M650 106 L700 106 L728 72 L770 142 L812 86 L845 112 L884 61 L925 106 L958 106"
        fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="430" stroke-dashoffset="430" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="430;0;0" keyTimes="0;0.7;1" dur="4.8s" repeatCount="indefinite"/>
  </path>
  <circle cx="884" cy="61" r="4" fill="#ff3bd4" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
