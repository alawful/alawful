<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title description">
  <title id="title">Ali Owlia neon research console</title>
  <desc id="description">Animated cyberpunk-style banner for engineering science, embedded AI, simulation, and optimization.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.52" stop-color="#0a1026"/>
      <stop offset="1" stop-color="#13051e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.52" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d9ff" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="22" y="22" width="956" height="256" rx="15"/></clipPath>
  </defs>

  <rect width="1000" height="300" rx="20" fill="url(#background)"/>
  <rect x="2" y="2" width="996" height="296" rx="18" fill="none" stroke="url(#neon)" stroke-width="3"/>
  <rect x="22" y="22" width="956" height="256" rx="15" fill="url(#grid)" stroke="#243153"/>

  <g clip-path="url(#screen)">
    <path d="M0 238 L125 210 L245 226 L360 174 L480 190 L605 118 L720 150 L845 78 L1000 104"
          fill="none" stroke="#00f5ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="620" stroke-dashoffset="620" filter="url(#cyanGlow)">
      <animate attributeName="stroke-dashoffset" values="620;0;0" keyTimes="0;0.72;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0 254 L160 246 L290 205 L405 222 L540 164 L665 182 L805 116 L1000 132"
          fill="none" stroke="#ff2bd6" stroke-opacity="0.65" stroke-width="1.5" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="3s" repeatCount="indefinite"/>
    </path>

    <g fill="#00f5ff" filter="url(#cyanGlow)">
      <circle cx="360" cy="174" r="4"><animate attributeName="r" values="3;7;3" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="605" cy="118" r="4"><animate attributeName="r" values="3;7;3" dur="2.2s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="845" cy="78" r="4"><animate attributeName="r" values="3;7;3" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="22" y="-35" width="956" height="45" fill="url(#scan)">
      <animate attributeName="y" from="-35" to="300" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="47" cy="45" r="5" fill="#ff2b6a"/>
  <circle cx="65" cy="45" r="5" fill="#ffd166"/>
  <circle cx="83" cy="45" r="5" fill="#00f5a0"/>
  <text x="105" y="50" fill="#6c7ca8" font-family="Consolas, Monaco, monospace" font-size="13" letter-spacing="2">RESEARCH_CONSOLE.EXE</text>

  <text x="62" y="126" fill="#ecfaff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" letter-spacing="4">ALI OWLIA</text>
  <text x="64" y="157" fill="url(#neon)" font-family="Consolas, Monaco, monospace" font-size="17" font-weight="700" letter-spacing="3" filter="url(#pinkGlow)">SYSTEMS → MODELS → EXPERIMENTS</text>
  <text x="64" y="191" fill="#9db0d8" font-family="Consolas, Monaco, monospace" font-size="14" letter-spacing="1.5">ENGINEERING SCIENCE  //  EMBEDDED AI  //  SIMULATION  //  OPTIMIZATION</text>

  <g font-family="Consolas, Monaco, monospace" font-size="12" letter-spacing="1.5">
    <text x="64" y="250" fill="#00f5ff">UT::TEHRAN</text>
    <text x="455" y="250" fill="#9db0d8">EXPECTED_GRAD::2027</text>
    <text x="790" y="250" fill="#ff2bd6">STATUS::BUILDING</text>
  </g>

  <path d="M760 54 h165" stroke="#ff2bd6" stroke-width="2" filter="url(#pinkGlow)"/>
  <path d="M925 54 v28 h30" fill="none" stroke="#00f5ff" stroke-width="2"/>
  <path d="M45 215 v32 h-18" fill="none" stroke="#00f5ff" stroke-width="2"/>
</svg>
